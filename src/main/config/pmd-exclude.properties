# PMD exclusions with justifications
# Format: filepath=rule1,rule2
#
# Example:
# net/openhft/chronicle/threads/LegacyWorker.java=AvoidSynchronizedAtMethodLevel
# THR-SB-320: Chronicle Threads relies on explicit threading primitives; suppress baseline style rules until follow-up THR-320.
net/openhft/chronicle/threads/.+\.java=DoNotUseThreads,MethodArgumentCouldBeFinal,LocalVariableCouldBeFinal,RedundantFieldInitializer,AvoidFieldNameMatchingMethodName,AvoidLiteralsInIfCondition,NullAssignment
# THR-SB-321: Internal monitoring utilities intentionally build verbose diagnostics; cleanup tracked in THR-321.
net/openhft/chronicle/threads/internal/.+\.java=DoNotUseThreads,MethodArgumentCouldBeFinal,LocalVariableCouldBeFinal,InsufficientStringBufferDeclaration,ConsecutiveAppendsShouldReuse,ConsecutiveLiteralAppends,AssignmentInOperand,UselessParentheses,CommentDefaultAccessModifier
# THR-SB-322: Legacy constructors use null sentinel assignments; tracked for refactor in THR-322.
net/openhft/chronicle/threads/EventGroup.java=NullAssignment
net/openhft/chronicle/threads/NamedThreadFactory.java=NullAssignment
net/openhft/chronicle/threads/VanillaEventLoop.java=NullAssignment
net/openhft/chronicle/threads/MediumEventLoop.java=AvoidInstantiatingObjectsInLoops
